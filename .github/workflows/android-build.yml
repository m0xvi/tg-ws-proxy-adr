name: Build Android APK (debug)

# Debug-сборка universal APK тем же ключом, что стоит на телефоне:
# keystore/debug.keystore восстанавливается из секрета DEBUG_KEYSTORE_BASE64
# (в git ключ НЕ коммитится). Такой APK ставится поверх установленного.
# Без секрета сборка тоже проходит, но подписывается ключом раннера.
#
# Сборка запускается:
#   - автоматически: при пуше в любую ветку;
#   - вручную: вкладка Actions -> Build Android APK (debug) -> Run workflow;
#   - при пуше тега вида v0.2.5 (заодно создаётся Release с APK).
on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

concurrency:
  group: apk-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # нужно для создания Release на тегах

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore shared debug keystore (if secret configured)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > keystore/debug.keystore
            chmod 600 keystore/debug.keystore
            echo "Shared debug keystore restored: APK signature will match the phone build."
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not set: APK will be signed with the runner debug key and will NOT install over the phone build."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build native libraries (arm64-v8a + armeabi-v7a)
        run: |
          set -e
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          cargo ndk -t arm64-v8a --platform 24 -o app/src/main/jniLibs build --release
          cargo ndk -t armeabi-v7a --platform 21 -o app/src/main/jniLibs build --release

      - name: Build APK (universal debug)
        run: |
          set -e
          # gradle.properties в репозитории настроен на слабую локальную машину
          # (-Xmx1400m, MaxMetaspaceSize=384m). На раннере этого мало: сборка
          # AGP 9 падает с "java.lang.OutOfMemoryError: Metaspace". Поднимаем
          # лимиты только в CI (тот же приём, что в build-apk.yml).
          sed -i -E \
            -e 's|^org\.gradle\.jvmargs=.*|org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8|' \
            -e 's|^kotlin\.daemon\.jvmargs=.*|kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m|' \
            gradle.properties
          ./gradlew :app:assembleUniversalDebug --no-daemon --no-configuration-cache \
            -Dorg.gradle.workers.max=1

      - name: Rename APK
        run: |
          set -e
          VN=$(grep -m1 -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/universal/debug/app-universal-debug.apk \
             "TG-WS-Proxy-Lab-${VN}-universal-debug.apk"
          ls -la TG-WS-Proxy-Lab-*.apk

      - name: Show APK certificate fingerprints
        run: |
          set -e
          APK=$(ls TG-WS-Proxy-Lab-*.apk | head -n 1)
          APKSIGNER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/35.0.0/apksigner"
          echo "== $APK"
          "$APKSIGNER" verify --print-certs "$APK"
          # Отпечаток дублируем в notice-аннотацию: она видна в Checks UI
          # и доступна через API (удобно сверять подпись без скачивания APK).
          FP=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 -oE "[0-9a-f]{64}" | tr 'a-f' 'A-F' | sed -e 's/../&:/g' -e 's/:$//')
          echo "::notice::APK signer SHA-256: $FP (phone expects F8:7E:2B:3C:38:5C:4E:68:0B:12:E9:5E:E8:42:74:B5:D7:E7:C8:4C:1F:61:8D:B2:9D:FB:9B:C6:D4:15:F6:61)"

      - name: Upload artifact (available from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: TG-WS-Proxy-Lab-debug-apk
          path: TG-WS-Proxy-Lab-*.apk
          if-no-files-found: error

      - name: Create release with APK (only on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TG-WS-Proxy-Lab-*.apk
