services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LISTEN_ADDR: ":8080"
      RELAY_TOKEN: "${RELAY_TOKEN:?set RELAY_TOKEN in .env}"
      MAX_CONNECTIONS: "${MAX_CONNECTIONS:-256}"
      WS_READ_LIMIT_BYTES: "${WS_READ_LIMIT_BYTES:-2097152}"
    expose:
      - "8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - relay_internal

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    depends_on:
      - relay
    environment:
      RELAY_DOMAIN: "${RELAY_DOMAIN:?set RELAY_DOMAIN in .env}"
    ports:
      - "8443:8443/tcp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - relay_internal

networks:
  relay_internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
