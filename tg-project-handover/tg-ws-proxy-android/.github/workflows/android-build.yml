name: Build Android APK

# Сборка запускается:
#   - вручную: вкладка Actions -> Build Android APK -> Run workflow
#   - автоматически: при пуше тега вида v0.2.5 (заодно создаётся Release с APK)
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # нужно для создания Release на тегах

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build native libraries (arm64-v8a + armeabi-v7a)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          cargo ndk -t arm64-v8a --platform 24 -o app/src/main/jniLibs build --release
          cargo ndk -t armeabi-v7a --platform 21 -o app/src/main/jniLibs build --release

      - name: Build APK (universal debug)
        run: >
          ./gradlew :app:assembleUniversalDebug --no-daemon
          -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseG1GC"
          -Dorg.gradle.workers.max=4

      - name: Rename APK
        run: |
          VN=$(grep -m1 -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/universal/debug/app-universal-debug.apk \
             "TG-WS-Proxy-Lab-${VN}-universal-debug.apk"
          ls -la TG-WS-Proxy-Lab-*.apk

      - name: Upload artifact (available from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: TG-WS-Proxy-Lab-debug-apk
          path: TG-WS-Proxy-Lab-*.apk
          if-no-files-found: error

      - name: Create release with APK (only on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TG-WS-Proxy-Lab-*.apk
